<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>かなラッシュ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="battle-page">
  <div class="app-shell">
    <header class="app-header">
      <h1 class="app-title">かなラッシュ</h1>
    </header>

    <section id="startScreen" class="screen screen-card">
      <div id="modeSelectTeaser">
        <img src="material/music_rapper_woman.png" alt="">
        <span class="vs-badge">VS</span>
        <img src="material/rapper.png" alt="">
      </div>
      <p class="lead-text">かなでつなぐしりとりゲーム。ひとりで練習するか、CPUやオフラインの相手と対戦しよう。</p>
      <div class="cta-stack">
        <button id="startPracticeButton" class="btn btn-primary">練習する</button>
        <button id="startBotBattleButton" class="btn btn-secondary">CPUと対戦する</button>
        <button id="startOfflineBattleButton" class="btn btn-secondary">２人で対戦する</button>
      </div>
    </section>

    <section id="practiceScreen" class="screen screen-card hidden">
      <div id="battleStage" class="single-stage">
        <div class="fighter active-turn" id="practiceFighter">
          <div class="fighter-portrait"><img src="material/music_rapper_woman.png" alt=""></div>
          <div class="fighter-name">あなた</div>
        </div>
      </div>

      <div class="turn-info-bar">
        <span id="wordCountLabel" class="pill"></span>
      </div>

      <div class="timer-row">
        <div class="timer-badge square-badge" id="practiceTimerBadge">
          <span class="timer-unit">秒</span>
          <span id="practiceTimerValue">60</span>
        </div>
        <div class="total-char-badge square-badge" title="獲得文字数">
          <span class="total-char-label">計</span>
          <span id="practiceScoreValue">0</span>
        </div>
        <div class="next-char-badge square-badge" id="practiceNextCharBadge" title="次の頭文字">
          <span class="next-char-label">次</span>
          <span id="practiceNextCharValue"></span>
        </div>
        <div class="prompt-card">
          <div class="prompt-line">
            <span class="prompt-label">現在</span>
            <span id="practiceCurrentWord" class="prompt-word prompt-word-current"></span>
          </div>
        </div>
      </div>

      <div id="practiceInputArea" class="input-row">
        <input id="practiceWordInput" type="text" autocomplete="off" placeholder="つづく単語を入力...">
        <button id="practiceSubmitButton" class="btn btn-primary btn-compact">送信</button>
      </div>
      <p id="practiceErrorMessage" class="error-message"></p>

      <div class="chip-list-header">
        <span>これまでの単語</span>
      </div>
      <ul id="practiceWordList" class="word-chip-list"></ul>
    </section>
  </div>

  <!-- ポップアップ: 結果(タイムアップ・「ん」・既出語のいずれでも表示) -->
  <div id="resultOverlay" class="modal-overlay hidden">
    <div class="modal-card screen-card">
      <p class="eyebrow">RESULT</p>
      <h2 id="resultTitle" class="section-title"></h2>
      <p class="caption" id="resultDetail"></p>
      <div class="cta-stack">
        <button id="retryButton" class="btn btn-primary">もう一度挑戦する</button>
      </div>
    </div>
  </div>

  <!-- 「んワード」「同じワード」を画面中央に大きく演出(対戦モードと共通) -->
  <div id="failureFlash" class="failure-flash hidden">
    <span id="failureFlashText"></span>
  </div>

  <script>
    const PRACTICE_SECONDS = 60;

    // server.js の VOWEL_MAP / effectiveLastChar と同じ内容(表示専用のクライアント側コピー、
    // battle.html と同一)。「ー」で終わる単語は直前の音の母音が実際の継続文字になる。
    const VOWEL_MAP = {
      あ: "あ", か: "あ", が: "あ", さ: "あ", ざ: "あ", た: "あ", だ: "あ",
      な: "あ", は: "あ", ば: "あ", ぱ: "あ", ま: "あ", や: "あ", ら: "あ",
      わ: "あ", ぁ: "あ", ゃ: "あ",
      い: "い", き: "い", ぎ: "い", し: "い", じ: "い", ち: "い", ぢ: "い",
      に: "い", ひ: "い", び: "い", ぴ: "い", み: "い", り: "い", ゐ: "い",
      ぃ: "い",
      う: "う", く: "う", ぐ: "う", す: "う", ず: "う", つ: "う", づ: "う",
      ぬ: "う", ふ: "う", ぶ: "う", ぷ: "う", む: "う", ゆ: "う", る: "う",
      ぅ: "う", ゅ: "う",
      え: "え", け: "え", げ: "え", せ: "え", ぜ: "え", て: "え", で: "え",
      ね: "え", へ: "え", べ: "え", ぺ: "え", め: "え", れ: "え", ゑ: "え",
      ぇ: "え",
      お: "お", こ: "お", ご: "お", そ: "お", ぞ: "お", と: "お", ど: "お",
      の: "お", ほ: "お", ぼ: "お", ぽ: "お", も: "お", よ: "お", ろ: "お",
      を: "お", ぉ: "お", ょ: "お",
    };

    function effectiveLastChar(word) {
      if (!word) return "";
      if (word.slice(-1) === "ー" && word.length >= 2) {
        const vowel = VOWEL_MAP[word[word.length - 2]];
        if (vowel) return vowel;
      }
      return word.slice(-1);
    }

    // 次に入力すべき頭文字をタイマー隣に1文字だけ表示する(battle.html と共通の見た目)
    function updateNextChar() {
      document.querySelector("#practiceNextCharValue").textContent = effectiveLastChar(currentWord);
    }

    document.querySelector("#practiceNextCharBadge").onclick = () => {
      const input = document.querySelector("#practiceWordInput");
      const nextChar = document.querySelector("#practiceNextCharValue").textContent;
      if (input && !input.disabled && nextChar) {
        input.value = nextChar;
        input.focus();
      }
    };

    let currentWord = "";
    let score = 0;
    let wordList = [];
    let timerHandle = null;
    let timeLeft = PRACTICE_SECONDS;

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach((el) => el.classList.add("hidden"));
      document.querySelector(`#${id}`).classList.remove("hidden");
    }

    function showOverlay(id) {
      document.querySelector(`#${id}`).classList.remove("hidden");
    }

    function hideOverlay(id) {
      document.querySelector(`#${id}`).classList.add("hidden");
    }

    let failureFlashTimeout = null;

    // 「同じワード」「んワード」を画面中央に大きく表示する(対戦モードと共通の演出)
    function showFailureFlash(text) {
      const el = document.querySelector("#failureFlash");
      clearTimeout(failureFlashTimeout);
      el.classList.remove("hidden", "flash-anim");
      document.querySelector("#failureFlashText").textContent = text;
      void el.offsetWidth; // reflow させてアニメーションを最初から再生する
      el.classList.add("flash-anim");
      failureFlashTimeout = setTimeout(() => {
        el.classList.add("hidden");
        el.classList.remove("flash-anim");
      }, 1100);
    }

    function renderWordChips() {
      document.querySelector("#practiceWordList").innerHTML = wordList
        .map((w) => `<li class="word-chip">${w}<span class="chip-count">${w.length}</span></li>`)
        .join("");
    }

    function tickTimer() {
      timeLeft -= 1;
      const badge = document.querySelector("#practiceTimerBadge");
      const shown = Math.max(timeLeft, 0);
      document.querySelector("#practiceTimerValue").textContent = String(shown);
      badge.classList.toggle("timer-warning", shown <= 15 && shown > 5);
      badge.classList.toggle("timer-critical", shown <= 5);
      if (timeLeft <= 0) {
        clearInterval(timerHandle);
        endRun("タイムアップ！");
      }
    }

    function runTimer() {
      clearInterval(timerHandle);
      timeLeft = PRACTICE_SECONDS;
      const badge = document.querySelector("#practiceTimerBadge");
      badge.classList.remove("timer-warning", "timer-critical");
      document.querySelector("#practiceTimerValue").textContent = String(timeLeft);
      timerHandle = setInterval(tickTimer, 1000);
    }

    // 単語判定の通信中はタイマーを止め、結果が返ってきたら再開する
    function pauseTimer() {
      clearInterval(timerHandle);
    }

    function resumeTimer() {
      if (timeLeft > 0) {
        timerHandle = setInterval(tickTimer, 1000);
      }
    }

    async function startPractice() {
      score = 0;
      wordList = [];
      document.querySelector("#practiceScoreValue").textContent = "0";
      document.querySelector("#practiceWordList").innerHTML = "";
      document.querySelector("#practiceErrorMessage").textContent = "";
      document.querySelector("#wordCountLabel").textContent = "0 語";

      const response = await fetch("/reset", { method: "POST" });
      const data = await response.json();
      currentWord = data.word;
      document.querySelector("#practiceCurrentWord").textContent = currentWord;
      updateNextChar();

      const input = document.querySelector("#practiceWordInput");
      input.value = "";
      input.disabled = false;

      showScreen("practiceScreen");
      input.focus();
      runTimer();
    }

    async function submitPracticeWord() {
      const input = document.querySelector("#practiceWordInput");
      const word = input.value;
      input.value = "";
      if (!word) return;

      pauseTimer();

      const response = await fetch("/shiritori", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nextWord: word }),
      });
      const data = await response.json();

      if (response.status !== 200) {
        document.querySelector("#practiceErrorMessage").textContent = data.errorMessage;

        if (data.errorCode === "10002") {
          showFailureFlash("同じワード！");
          endRun("同じ単語を使ってしまいました");
          return;
        }
        if (data.errorCode === "10003") {
          showFailureFlash("「ん」ワード！");
          endRun("「ん」で終わってしまいました");
          return;
        }

        resumeTimer();
        return;
      }

      document.querySelector("#practiceErrorMessage").textContent = "";
      currentWord = data.word;
      document.querySelector("#practiceCurrentWord").textContent = currentWord;
      updateNextChar();
      wordList.push(currentWord);
      score += currentWord.length;
      document.querySelector("#practiceScoreValue").textContent = String(score);
      document.querySelector("#wordCountLabel").textContent = `${wordList.length} 語`;
      renderWordChips();
      resumeTimer();
    }

    function endRun(message) {
      clearInterval(timerHandle);
      document.querySelector("#practiceWordInput").disabled = true;
      document.querySelector("#resultTitle").textContent = message;
      document.querySelector("#resultDetail").textContent =
        `スコア: ${score} 文字 / ${wordList.length} 語つなげました`;
      showOverlay("resultOverlay");
    }

    document.querySelector("#startPracticeButton").onclick = startPractice;
    document.querySelector("#startBotBattleButton").onclick = () => {
      location.href = "/battle.html?mode=bot";
    };
    document.querySelector("#startOfflineBattleButton").onclick = () => {
      location.href = "/battle.html?mode=human";
    };
    document.querySelector("#practiceSubmitButton").onclick = submitPracticeWord;
    document.querySelector("#practiceWordInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitPracticeWord();
    });
    document.querySelector("#retryButton").onclick = () => {
      hideOverlay("resultOverlay");
      startPractice();
    };

    showScreen("startScreen");
  </script>
</body>
</html>
